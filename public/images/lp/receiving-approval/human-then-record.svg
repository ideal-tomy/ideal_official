<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-labelledby="htrTitle htrDesc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">
  <title id="htrTitle">要確認だけ人が見て、承認に根拠が残る</title>
  <desc id="htrDesc">要確認と記載なしだけが人に渡り、確認内容が承認記録に残る。</desc>
  <style>
    svg{--ink:#1F2A33;--line:#3A4650;--muted:#6B7780;--soft:#F4F6F7;--edge:#C4CBD1;--ok:#0E5C4C;--brand:#1F4B7A;color-scheme:light only;font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
    .t{fill:var(--ink)}.t-mut{fill:var(--muted)}.t-w{fill:#FFFFFF}.box{fill:#FFFFFF;stroke:var(--line);stroke-width:1.6}
  </style>
  <rect class="box" x="40" y="100" width="180" height="70" rx="4"/>
  <text class="t" x="130" y="142" text-anchor="middle" font-size="15" font-weight="700">一致 → 通過</text>
  <rect class="box" x="40" y="190" width="180" height="70" rx="4"/>
  <text class="t" x="130" y="232" text-anchor="middle" font-size="15" font-weight="700">要確認・記載なし</text>
  <path d="M230,225 L310,225" stroke="var(--edge)" stroke-width="2.4" fill="none"/>
  <polygon points="310,225 298,219 298,231" fill="var(--edge)"/>
  <rect x="320" y="160" width="200" height="130" rx="4" fill="var(--brand)"/>
  <text class="t-w" x="420" y="210" text-anchor="middle" font-size="16" font-weight="700">人が確認</text>
  <text class="t-w" x="420" y="240" text-anchor="middle" font-size="13">同等材か／別書類で特定</text>
  <path d="M530,225 L610,225" stroke="var(--edge)" stroke-width="2.4" fill="none"/>
  <polygon points="610,225 598,219 598,231" fill="var(--edge)"/>
  <rect class="box" x="620" y="150" width="220" height="150" rx="4"/>
  <text class="t-mut" x="730" y="190" text-anchor="middle" font-size="13">承認に残る</text>
  <text class="t" x="730" y="230" text-anchor="middle" font-size="15" font-weight="700">何を確認したか</text>
  <text class="t" x="730" y="258" text-anchor="middle" font-size="14">根拠・添付</text>
  <text class="t" x="440" y="360" text-anchor="middle" font-size="18" font-weight="700">確認した内容が、あとから辿れる形で残る。</text>
</svg>
