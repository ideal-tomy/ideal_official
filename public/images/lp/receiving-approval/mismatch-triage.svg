<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="mtTitle mtDesc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">
  <title id="mtTitle">図面と証明書を突き合わせ、3つに分ける</title>
  <desc id="mtDesc">図面の指定と材料証明書を比べ、一致・要確認・記載なしに分ける。</desc>
  <style>
    svg{--ink:#1F2A33;--line:#3A4650;--muted:#6B7780;--soft:#F4F6F7;--edge:#C4CBD1;--ok:#2B6FE0;--warn:#A67C2A;--miss:#A8574B;color-scheme:light only;font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
    .t{fill:var(--ink)}.t-mut{fill:var(--muted)}.t-w{fill:#FFFFFF}.box{fill:#FFFFFF;stroke:var(--line);stroke-width:1.6}
  </style>
  <rect class="box" x="48" y="80" width="200" height="120" rx="4"/>
  <text class="t-mut" x="148" y="112" text-anchor="middle" font-size="13">図面・仕様</text>
  <text class="t" x="148" y="148" text-anchor="middle" font-size="16" font-weight="700">材質 SUS304</text>
  <text class="t" x="148" y="174" text-anchor="middle" font-size="14">板厚 10.0</text>
  <rect class="box" x="48" y="230" width="200" height="120" rx="4"/>
  <text class="t-mut" x="148" y="262" text-anchor="middle" font-size="13">材料証明書</text>
  <text class="t" x="148" y="298" text-anchor="middle" font-size="16" font-weight="700">材質 SUSXM7</text>
  <text class="t" x="148" y="324" text-anchor="middle" font-size="14">ロット 記載なし</text>
  <path d="M268,200 L340,200" stroke="var(--edge)" stroke-width="2.4" fill="none"/>
  <polygon points="340,200 328,194 328,206" fill="var(--edge)"/>
  <rect x="360" y="150" width="140" height="100" rx="4" fill="var(--soft)" stroke="var(--line)" stroke-width="1.6"/>
  <text class="t" x="430" y="198" text-anchor="middle" font-size="15" font-weight="700">AIが仕分け</text>
  <text class="t-mut" x="430" y="224" text-anchor="middle" font-size="12">突き合わせ</text>
  <path d="M520,200 L590,200" stroke="var(--edge)" stroke-width="2.4" fill="none"/>
  <polygon points="590,200 578,194 578,206" fill="var(--edge)"/>
  <rect x="610" y="70" width="220" height="56" rx="4" fill="var(--ok)"/>
  <text class="t-w" x="720" y="104" text-anchor="middle" font-size="16" font-weight="700">一致</text>
  <rect x="610" y="152" width="220" height="56" rx="4" fill="var(--warn)"/>
  <text class="t-w" x="720" y="186" text-anchor="middle" font-size="16" font-weight="700">要確認</text>
  <rect x="610" y="234" width="220" height="56" rx="4" fill="var(--miss)"/>
  <text class="t-w" x="720" y="268" text-anchor="middle" font-size="16" font-weight="700">記載なし</text>
  <text class="t" x="440" y="380" text-anchor="middle" font-size="18" font-weight="700">全部を人が見るのではなく、ずれだけを分ける。</text>
</svg>
