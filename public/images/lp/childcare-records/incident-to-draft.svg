<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="itdTitle itdDesc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">
  <title id="itdTitle">事案メモから報告書の下書きへ</title>
  <desc id="itdDesc">園の出来事メモが、報告書の下書きになる流れ。</desc>
  <style>
    svg{--ink:#1F2A33;--line:#3A4650;--muted:#6B7780;--soft:#F4F6F7;--edge:#C4CBD1;--brand:#1F4B7A;color-scheme:light only;font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
    .t{fill:var(--ink)}.t-mut{fill:var(--muted)}.t-w{fill:#FFFFFF}.box{fill:#FFFFFF;stroke:var(--line);stroke-width:1.6}
  </style>
  <rect class="box" x="60" y="90" width="240" height="160" rx="4"/>
  <text class="t-mut" x="180" y="130" text-anchor="middle" font-size="13">事案メモ</text>
  <text class="t" x="180" y="168" text-anchor="middle" font-size="14">A君・園庭転倒</text>
  <text class="t" x="180" y="196" text-anchor="middle" font-size="14">擦り傷・処置済み</text>
  <path d="M320,170 L400,170" stroke="var(--edge)" stroke-width="2.4" fill="none"/>
  <rect x="410" y="120" width="140" height="100" rx="4" fill="var(--brand)"/>
  <text class="t-w" x="480" y="178" text-anchor="middle" font-size="15" font-weight="700">整える</text>
  <path d="M570,170 L650,170" stroke="var(--edge)" stroke-width="2.4" fill="none"/>
  <rect class="box" x="660" y="90" width="180" height="160" rx="4"/>
  <text class="t-mut" x="750" y="130" text-anchor="middle" font-size="13">報告書下書き</text>
  <text class="t" x="750" y="168" text-anchor="middle" font-size="14">対象・時刻・場所</text>
  <text class="t" x="750" y="196" text-anchor="middle" font-size="14">対応・連絡文案</text>
  <text class="t" x="440" y="330" text-anchor="middle" font-size="18" font-weight="700">ゼロから書くのではなく、下書きを直す。</text>
</svg>
