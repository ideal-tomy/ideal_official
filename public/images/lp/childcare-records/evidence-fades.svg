<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-labelledby="efTitle efDesc" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">
  <title id="efTitle">あとから書くほど、根拠が薄くなる</title>
  <desc id="efDesc">その場では詳細とルールが残っているが、時間が空くと「処置した」だけになり、根拠が消える。</desc>
  <style>
    svg{--ink:#1F2A33;--line:#3A4650;--muted:#6B7780;--soft:#F4F6F7;--edge:#C4CBD1;--loss:#A8574B;color-scheme:light only;font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
    .t{fill:var(--ink)}.t-mut{fill:var(--muted)}.t-loss{fill:var(--loss)}.t-w{fill:#FFFFFF}
    .frame{fill:#FFFFFF;stroke:var(--line);stroke-width:1.6}
  </style>
  <defs>
    <marker id="efAh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4650"/>
    </marker>
  </defs>
  <text class="t" x="160" y="48" text-anchor="middle" font-size="15" font-weight="700">① その場（10:15）</text>
  <text class="t" x="440" y="48" text-anchor="middle" font-size="15" font-weight="700">② 夕方</text>
  <text class="t" x="720" y="48" text-anchor="middle" font-size="15" font-weight="700">③ あとから書くとき</text>
  <rect class="frame" x="40" y="68" width="240" height="250" rx="4"/>
  <text class="t" x="160" y="104" text-anchor="middle" font-size="14" font-weight="700">残っていること</text>
  <text class="t" x="160" y="140" text-anchor="middle" font-size="13">右膝の擦り傷</text>
  <text class="t" x="160" y="168" text-anchor="middle" font-size="13">流水で洗った</text>
  <text class="t" x="160" y="196" text-anchor="middle" font-size="13">絆創膏を貼った</text>
  <text class="t" x="160" y="232" text-anchor="middle" font-size="13">マニュアル 3-2</text>
  <text class="t-mut" x="160" y="280" text-anchor="middle" font-size="12">根拠まで覚えている</text>
  <rect class="frame" x="320" y="68" width="240" height="250" rx="4"/>
  <text class="t" x="440" y="104" text-anchor="middle" font-size="14" font-weight="700">薄れはじめる</text>
  <text class="t-mut" x="440" y="140" text-anchor="middle" font-size="13">転んだ</text>
  <text class="t-mut" x="440" y="168" text-anchor="middle" font-size="13">洗った気がする</text>
  <text class="t-mut" x="440" y="196" text-anchor="middle" font-size="13" opacity="0.55">絆創膏…？</text>
  <text class="t-mut" x="440" y="232" text-anchor="middle" font-size="13" opacity="0.35">ルールは？</text>
  <text class="t-mut" x="440" y="280" text-anchor="middle" font-size="12">細部が落ちる</text>
  <rect class="frame" x="600" y="68" width="240" height="250" rx="4"/>
  <text class="t-loss" x="720" y="104" text-anchor="middle" font-size="14" font-weight="700">残る文面</text>
  <text class="t" x="720" y="160" text-anchor="middle" font-size="14">転んだ。</text>
  <text class="t" x="720" y="192" text-anchor="middle" font-size="14">処置した。</text>
  <text class="t-loss" x="720" y="240" text-anchor="middle" font-size="13" font-weight="700">ルール引用なし</text>
  <text class="t-loss" x="720" y="280" text-anchor="middle" font-size="12">根拠が残らない</text>
  <line x1="40" y1="350" x2="820" y2="350" stroke="var(--line)" stroke-width="1.6" marker-end="url(#efAh)"/>
  <text class="t-mut" x="840" y="372" text-anchor="end" font-size="13">時間の経過</text>
  <text class="t" x="440" y="420" text-anchor="middle" font-size="18" font-weight="700">あとから書くと、「適切に対応した」だけが残る。</text>
  <text class="t-mut" x="440" y="446" text-anchor="middle" font-size="13">どのルールに沿ったかは、その場で残さないと消える</text>
</svg>
